# /etc/wsconsctl.conf - console and input settings for the T480s (OpenBSD 8.0).
# Applied at boot by wsconsctl(8); see wsconsctl.conf(5) and wsmouse(4).
# Values below are the proven-working hardware baseline for this machine.
# Test live with: doas wsconsctl <key>=<value>   (reboot to verify boot-apply)

# Console / keyboard
keyboard.map.keylayout=uk
display.brightness=100

# Pointer devices (wscons/wsmouse on pms/Elantech): natural scrolling, speed,
# and tap-to-click mapping (1-finger,2-finger,3-finger -> button). mouse1
# targets the second pointer device where exposed (e.g. TrackPoint).
mouse.reverse_scrolling=1
mouse.scaling=0.575
mouse.tp.tapping=1,3,2
mouse1.reverse_scrolling=1
