# /etc/unwind.conf - validating resolver with a local DNS blocklist backstop.
#
# unwind learns upstream resolvers from resolvd(8) (autoconf) and can recurse on
# its own. The block list is a best-effort ad/tracker filter; regenerate it with
# ~/bin/update-blocklist.

block list "/var/db/unwind.block" log

preference { recursor autoconf oDoT-autoconf stub }
