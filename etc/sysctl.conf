# /etc/sysctl.conf - managed by openbsd-setup
#
# T480s (OpenBSD 8.0): S3 suspend/resume can trigger an ACPI GPE 0x16 storm
# (irq48/acpi0) causing sustained ~100% CPU load, fan spin, and battery drain.
# Observed on this hardware/BIOS even when isolated on battery (no dock/USB).
# Hibernate (ZZZ) is confirmed to work reliably on this setup, so lid close
# triggers hibernate instead of S3. Avoid zzz/S3 unless/until the ACPI issue
# is resolved (BIOS/update or newer OpenBSD).
machdep.lidaction=2
