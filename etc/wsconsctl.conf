# /etc/wsconsctl.conf - console/input/brightness settings.
# Applied at boot by wsconsctl(8). Uncomment/adjust as needed for your hardware.

# Keyboard layout example (uncomment and set, e.g. uk, us, de):
#keyboard.map.keylayout=uk

# Display brightness (range is hardware-dependent):
#display.brightness=80

# Touchpad/pointer defaults (T480s-class Elantech/Synaptics via pms/wsmouse).
# Enable natural ("reverse") scrolling and tap-to-click where supported.
# These are harmless no-ops on hardware/drivers that do not expose the key.
mouse.reverse_scrolling=1
mouse.tp.reverse_scrolling=1
mouse.tp.tapping=1
