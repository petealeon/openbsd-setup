# ~/.tmux.conf — amber, 1-based panes, st-256color
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -g default-terminal "st-256color"
set -g set-clipboard on
set -g escape-time 0

set -g status-style "bg=#0f0e0c,fg=#e6ded0"
set -g status-left "#[fg=#ffb000,bold] #S "
set -g status-right "#[fg=#9aa66b]%H:%M #[fg=#8a8175]#h "
set -g window-status-style "fg=#8a8175,bg=#0f0e0c"
set -g window-status-current-style "fg=#0f0e0c,bg=#ffb000,bold"
set -g pane-border-style "fg=#2a241b"
set -g pane-active-border-style "fg=#ffb000"
set -g message-style "bg=#17140f,fg=#ffb000"
set -g message-command-style "bg=#17140f,fg=#e6ded0"
set -g mode-style "bg=#ffb000,fg=#0f0e0c"
set -g clock-mode-colour "#ffb000"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"
unbind C-b
set -g prefix C-a
bind C-a send-prefix
