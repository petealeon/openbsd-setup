# ~/.spectrwm.conf
program[term]		= xterm
program[launcher]	= dmenu_run
program[browser]	= firefox
program[screenshot]	= maim -s

# Super instead of Alt, to match Omarchy muscle memory.
modkey			= Mod4

bar_type		= screen
bar_justify		= left
bar_font		= fixed
bar_font_color		= #c0caf5
bar_color		= #1a1b26
bar_border_width	= 1
bar_border_color	= #7aa2f7

color_focus		= #7aa2f7
color_unfocus		= #414868
color_urgent		= #e0af68

border_width		= 1
focus_mode		= follow
focus_default		= last
spawn_position		= next
workspace_limit		= 10

bind[term]		= Mod4+Return
bind[menu]		= Mod4+p
bind[restart]		= Mod4+Shift+r
bind[quit]		= Mod4+Shift+q
