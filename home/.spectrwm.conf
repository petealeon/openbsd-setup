# ~/.spectrwm.conf
program[term]		= xterm
program[launcher]	= dmenu_run
program[browser]	= firefox
program[screenshot]	= maim -s

# Super instead of Alt, to match Omarchy muscle memory.
modkey			= Mod4

bar_justify		= left
bar_font		= fixed
bar_font_color[1]	= rgb:c0/ca/f5
bar_color[1]		= rgb:1a/1b/26
bar_border_width	= 1
bar_border[1]		= rgb:7a/a2/f7

color_focus		= rgb:7a/a2/f7
color_unfocus		= rgb:41/48/68
color_urgent		= rgb:e0/af/68

border_width		= 1
focus_mode		= follow
focus_default		= last
spawn_position		= next
workspace_limit		= 10

bind[term]		= Mod4+Return
bind[menu]		= Mod4+p
bind[restart]		= Mod4+Shift+r
bind[quit]		= Mod4+Shift+q
