# ============================================================================
#  ~/.spectrwm.conf — amber desktop, OpenBSD 8.0, ThinkPad T480s
#
#  Colours and the bar font live between the "theme colors" markers near the
#  bottom.  `theme-apply <name>` rewrites that block from
#  ~/.config/spectrwm/themes/<name>/spectrwm.colors; everything else is yours.
#
#  NOTE: spectrwm strips anything after an unescaped '#', so colours here are
#  written as rgb:rr/gg/bb (not #rrggbb).
# ============================================================================

# ── core ─────────────────────────────────────────────────────────────────────
modkey                  = Mod4
workspace_limit         = 10
focus_mode              = default
focus_close             = previous
focus_close_wrap        = 1
focus_default           = last
spawn_position          = next
cycle_visible           = 1
warp_focus              = 1
warp_pointer            = 0
click_to_raise          = 1
workspace_autorotate    = 1

# ── window decoration and tiling ─────────────────────────────────────────────
border_width            = 2
tile_gap                = 8
region_padding          = 8
boundary_width          = 50
dialog_ratio            = 0.6
move_step               = 40
resize_step             = 40
layout_order            = horizontal,vertical,max,floating

# ── programs ─────────────────────────────────────────────────────────────────
program[term]           = st
program[spawn_term]     = st
program[lock]           = $HOME/bin/lock
program[menu]           = rofi -show drun -show-icons
program[search]         = rofi -dmenu -i -p Search
program[name_workspace] = rofi -dmenu -p Workspace
program[launcher]       = $HOME/bin/launcher
program[winmenu]        = rofi -show window -show-icons
program[keybinds]       = $HOME/bin/keybinds
program[screenshot_all]    = $HOME/bin/screenshot full
program[screenshot_wind]   = $HOME/bin/screenshot window
program[screenshot_region] = $HOME/bin/screenshot region
program[vol_up]         = $HOME/bin/volume up
program[vol_down]       = $HOME/bin/volume down
program[vol_mute]       = $HOME/bin/volume toggle
program[bright_up]      = $HOME/bin/brightness up
program[bright_down]    = $HOME/bin/brightness down
program[kbdlight_up]    = $HOME/bin/kbdlight up
program[kbdlight_down]  = $HOME/bin/kbdlight down
program[kbdlight_cycle] = $HOME/bin/kbdlight cycle
program[nightlight]     = $HOME/bin/nightlight toggle
program[audio_output]   = $HOME/bin/audio-output
program[browser]        = $HOME/bin/browser
program[filemanager]    = $HOME/bin/files
program[music]          = $HOME/bin/music
program[games]          = $HOME/bin/games
program[video]          = $HOME/bin/video-download
program[copyurl]        = $HOME/bin/copy-url

# Never let a missing helper take over the status bar with a validation
# error: a broken keybinding is easier to notice than a hidden bar.
spawn_flags[.*]         += optional

# ── bindings ─────────────────────────────────────────────────────────────────
# applications
bind[term]              = MOD+Return
bind[browser]           = MOD+Shift+b
bind[filemanager]       = MOD+e
bind[launcher]          = MOD+space
bind[menu]              = MOD+d
bind[winmenu]           = MOD+Tab
bind[keybinds]          = MOD+Shift+slash
bind[music]             = MOD+Shift+m
bind[games]             = MOD+Shift+g
bind[video]             = MOD+Shift+d
bind[copyurl]           = MOD+Shift+c

# windows
bind[wind_del]          = MOD+q
bind[wind_kill]         = MOD+Shift+q
bind[quit]              = MOD+Shift+e
bind[fullscreen_toggle] = MOD+f
bind[float_toggle]      = MOD+Shift+f
bind[maximize_toggle]   = MOD+m
bind[focus_main]        = MOD+Shift+m
bind[name_workspace]    = MOD+Shift+n
bind[swap_main]         = MOD+Shift+Return
bind[focus_next]        = MOD+j
bind[focus_prev]        = MOD+k

# workspaces (explicit binds for reliable switching/moving on T480s)
bind[ws_1]              = MOD+1
bind[ws_2]              = MOD+2
bind[ws_3]              = MOD+3
bind[ws_4]              = MOD+4
bind[ws_5]              = MOD+5
bind[ws_6]              = MOD+6
bind[ws_7]              = MOD+7
bind[ws_8]              = MOD+8
bind[ws_9]              = MOD+9
bind[ws_10]             = MOD+0
bind[mvws_1]            = MOD+Shift+1
bind[mvws_2]            = MOD+Shift+2
bind[mvws_3]            = MOD+Shift+3
bind[mvws_4]            = MOD+Shift+4
bind[mvws_5]            = MOD+Shift+5
bind[mvws_6]            = MOD+Shift+6
bind[mvws_7]            = MOD+Shift+7
bind[mvws_8]            = MOD+Shift+8
bind[mvws_9]            = MOD+Shift+9
bind[mvws_10]           = MOD+Shift+0
bind[ws_next]           = MOD+Right
bind[ws_prev]           = MOD+Left
bind[ws_next_all]       = MOD+Up
bind[ws_prev_all]       = MOD+Down

# layout and session
bind[cycle_layout]      = MOD+Shift+space
bind[stack_reset]       = MOD+Control+space
bind[bar_toggle]        = MOD+b
bind[reload]            = MOD+Control+r
bind[lock]              = MOD+Escape

# screenshots
bind[screenshot_all]    = MOD+s
bind[screenshot_wind]   = MOD+Shift+s
bind[screenshot_region] = MOD+Control+s

# media and hardware keys
bind[vol_up]            = XF86AudioRaiseVolume
bind[vol_down]          = XF86AudioLowerVolume
bind[vol_mute]          = XF86AudioMute
bind[bright_up]         = XF86MonBrightnessUp
bind[bright_down]       = XF86MonBrightnessDown
bind[kbdlight_up]       = XF86KbdBrightnessUp
bind[kbdlight_down]     = XF86KbdBrightnessDown
bind[kbdlight_cycle]    = MOD+F5
bind[audio_output]      = MOD+Shift+a

# ── status bar ───────────────────────────────────────────────────────────────
bar_action              = $HOME/.config/spectrwm/bar.sh
bar_action_expand       = 1
bar_justify             = left
# +L = workspace indicators (see workspace_mark_* below), +W = focused title.
bar_format              = +|L  +|C +W  +|R +A
bar_padding_horizontal  = 10
bar_padding_vertical    = 4
bar_workspace_limit     = 10
workspace_indicator     = listall,markcurrent,markactive,markurgent,markempty

# ── quirks ───────────────────────────────────────────────────────────────────
quirk[.*:.*:.*:dialog,utility]   = FLOAT + ANYWHERE
quirk[.*:.*:.*:splash]           = FLOAT + ANYWHERE
quirk[Gimp:gimp]                 = FLOAT + ANYWHERE
# NB: no bracket expressions inside quirk[...] -- spectrwm ends the key at
# the first ']', so [Zz] would be a syntax error. .*athura.* covers both.
quirk[.*athura.*:.*]             = FLOAT
quirk[Feh:feh]                   = FLOAT
quirk[mpv:mpv]                   = FLOAT
quirk[Lxappearance:lxappearance] = FLOAT

# ============================================================================
# >>> theme colors >>>
# Managed by theme-apply. Change the theme files instead of this block.
color_focus             = rgb:ff/b0/00
color_unfocus           = rgb:17/14/0f
color_urgent            = rgb:d9/0d/10
color_focus_maximized   = rgb:ff/b0/00
color_unfocus_maximized = rgb:17/14/0f
color_urgent_maximized  = rgb:d9/0d/10
bar_enabled             = 1
bar_at_bottom           = 0
bar_border_width        = 1
bar_border[1]           = rgb:ff/b0/00
bar_border_unfocus[1]   = rgb:2a/24/1b
bar_color[1]            = rgb:0f/0e/0c,rgb:17/14/0f,rgb:20/1b/14,rgb:d9/0d/10
bar_color_unfocus[1]    = rgb:0f/0e/0c,rgb:17/14/0f,rgb:20/1b/14,rgb:d9/0d/10
bar_font_color[1]       = rgb:ff/b0/00,rgb:e6/de/d0,rgb:8a/81/75,rgb:d9/0d/10
bar_font_color_unfocus[1] = rgb:8a/81/75,rgb:8a/81/75,rgb:5c/55/4a,rgb:d9/0d/10
bar_color_selected      = rgb:ff/b0/00
bar_font_color_selected = rgb:0f/0e/0c
bar_font                = BlexMono Nerd Font:pixelsize=16:antialias=true
# workspace indicators: keep marks simple/reliable for spectrwm 3.7.0; styling
# is intentionally minimal to prioritize visibility over decoration.
workspace_mark_current        = [
workspace_mark_current_suffix = ] 
workspace_mark_active         =  
workspace_mark_active_suffix  =  
workspace_mark_empty          =  
workspace_mark_empty_suffix   =  
workspace_mark_urgent         = !
workspace_mark_urgent_suffix  =  

# <<< theme colors <<<
# ============================================================================
