# RetroArch defaults for the OpenBSD desktop (SDL2/sndio, controller-friendly).
# Paths and cores are where the OpenBSD packages install them.

menu_driver = "ozone"
video_driver = "gl"
audio_driver = "sdl2"
input_driver = "sdl2"
input_joypad_driver = "sdl2"

libretro_directory = "/usr/local/lib/libretro"
libretro_info_path = "/usr/local/share/libretro/info"
assets_directory = "/usr/local/share/libretro/assets"
joypad_autoconfig_dir = "/usr/local/share/libretro/autoconfig"

rgui_browser_directory = "~/Games/roms"
system_directory = "~/Games/bios"
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"
screenshot_directory = "~/Pictures/Screenshots"

pause_nonactive = "true"
savestate_auto_save = "false"
savestate_auto_load = "false"
video_vsync = "true"
video_smooth = "false"
all_users_control_menu = "true"
input_autodetect_enable = "true"
