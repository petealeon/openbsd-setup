# ~/.config/picom/picom.conf — amber desktop
#
# st cannot be built with the alpha patch against 0.9.2 (it fails a hunk), so
# window transparency is picom's job. xrender is the safe backend on the UHD
# 620; if you see tearing with glx, keep this file as it is.

backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

frame-opacity = 0.96;
inactive-opacity = 0.94;
active-opacity = 1.0;

blur-background = false;
detect-client-opacity = true;
refresh-rate = 0;

# st is the only translucent window: it should feel like glass, not a window.
opacity-rule = [
  "96:class_g = 'st'",
  "100:class_g = 'Chromium'"
];

# Never fade the things that steal focus or must be readable.
focus-exclude = [
  "class_g = 'slock'",
  "class_g = 'dunst'"
];
